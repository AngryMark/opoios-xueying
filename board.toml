schema_version = 2
# OnePlus Open CPH2551 (xueying, OnePlus projects 22003/22899), SM8550-AB, 16 GiB / 512 GiB, OxygenOS 16.0.1.300(EX01).
# OPOIOS fork of MoyuZJ912/UniXNU-aston b8832d72 (OnePlus Ace 3, iOS 27.0.1 24A446 as iPhone17,2 D94AP), itself derived from
# UniXNU-sheng. This is the owner's ONLY daily phone: every boot is `fastboot boot` from RAM, nothing is ever flashed, and no
# storage write path may be enabled (no [userdata], no native-ufs-root, no data-persist, no log, no persistent_data; the
# device tree never enables &ufs). Check with OPOIOS scripts/check-safe-config.sh before every boot.
# Stage 4 (OPOIOS docs/07-stage4-ram-root.md, step 7): the full iOS root from RAM. UEFI receives the RAM root store over USB
# (OS and SystemOS, verified block by block, read only); the root is the OS volume (root-matching), SystemOS is mounted over it
# and Data is the payload's packed Data seed on RamBlock, so every boot is a first boot. No GPU/touch/Wi-Fi/DSP yet.
# (Stage 3 ran XNU to restored with the IPSW's restore ramdisk as root: RamBlock, rd=md0-ramblock.)
# The package keeps the reference kit name "sheng" (installed as kits/sheng) and the "sheng-*" boot argument names: the shared
# scripts and drivers address the board kit by that name.
[board]
name = "xueying"
soc = "SM8550"
description = "OnePlus Open CPH2551 (xueying) - OPOIOS, RAM only"
kit = "sheng"
soc_source = "sm8550"
os_profile = "ios-27.0.1-24A446"

[kernel]
defconfig = "aston_ios27_defconfig"
config_fragments = ["arch:configs/common.config", "os:configs/ios.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu-12377/series"]
# The reference 24A446 archive chain. build-gop-legacy-display-27.py builds the board objects (touch, keys, brightness, battery,
# CPU frequency, GPU power) and links them against the original families of this fileset. fetch-sheng-dts.py and the prepare-sheng-*
# generators still read the reference board's devicetree for the GPU inputs (the same kalama GPU and GMU nodes).
archives = [
  # OPOIOS: aston's prepare-aston-ramblock.py is left out. It stages aston's "publish after store" fix of the persistent
  # Data store over RamBlock 60a54ce8 and refuses any other revision; UniXNU main carries RamBlock 737f6da (60a54ce8 plus
  # "report the device as solid state" and "return the packed seed's memory after the import"). Without a store
  # (no data-persist, no UFS in the device tree) the fix and the original publish the RAM disk the same way.
  # Before any storage step: component:ShengUfs runs build-sheng-source-storage.py without --policy-dir.
  "stage-aston-root-policies.py scripts/policies/ios-27.0.1-24A446",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "component:ShengUfs",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ios-27.0.1-24A446",
  # OPOIOS stage 4: the RAM root store driver (OpoiosRootStoreDisk, OpoiosRootStore.c, the LZFSE decoder) into
  # build/opoios-root-store/libOpoiosRootStore.a; it needs the IOStorageFamily headers the step above prepares.
  "build-opoios-root-store.py",
  "component:RamBlock",
  "component:Adreno740",
  "fetch-sheng-dts.py",
  "fetch-adreno-inputs.py",
  "prepare-sheng-gmu.py",
  "prepare-sheng-gpu-smmu.py",
  "prepare-sheng-gmu-votes.py",
  "build-adreno740-kits.py",
  # The IOAcceleratorES ABI of this kernelcache, before the accelerator builder seeds the iPad record.
  "stage-aston-accelerator-abi.py",
  "build-adreno740-accelerator.py",
  "component:AppleKeyStoreState",
  # OPOIOS: UniXNU requires an archive entry for every selected kernel-stage component. This one only compiles NativeAES for
  # the iPadOS 17 layout into build/software-aes (not linked: XNU_NATIVE_AES is off); the linked NativeAES is the one
  # build-gop-legacy-display-27.py compiles against software-aes-24A446-d94ap.json (as UniXNU-sheng for macOS 27.3).
  "component:SoftwareAES",
  "build-gop-legacy-display-27.py",
  "build-fileset-release-reference.py --tree . --lto",
]

[kernel.prelink]
# The profile's roots plus the USB device and host stacks (the reference board's list; the SoC's USB controller is the same).
# The iPhone17,2 fileset has no com.apple.iokit.IOHIDEventDriver bundle (the class ships in IOHIDFamily).
# OPOIOS stage 4: com.apple.security.Image4 is no root again, as on aston. Stage 3 made it one for its personality
# (IOPlatformDevice "defaults"): the restore ramdisk's launchd runs the cryptex ignition and waited in AppleImage4's sysctl
# ignition_blob for the "userspace cork" only Image4::start opens (phone run 2026-11-15 19:11 UTC; the uke port did the same),
# and Image4::start needed /chosen/boot-manifest-hash. With the full root, CONFIG_XNU_OWNER_CACHE_STARTUP sets dyld's
# no-ignition flag before launchd, so nothing waits for the cork; CONFIG_XNU_OWNER_BOOT_MANIFEST publishes the owner's
# boot-manifest-hash in load_init_program and refuses to replace one already in /chosen ("offline owner SystemOS mount
# failed"), so the ADT no longer carries it, and a started Image4 could run its magazine before that hash exists
# ("Image4: unable to initialize magazine: 7", phone run 2026-11-15 22:57 UTC). Image4 stays in the fileset as AppleImage4's
# library; package/Image4MonitorAbsent.c and its GOT slot stay as they are.
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOUSBDeviceFamily", "com.apple.driver.AppleUSBXDCI", "com.apple.driver.AppleUSBDeviceMux",
  # OPOIOS: restored_external's USB description has AppleUSBMux plus AppleUSBNCMControlAux and AppleUSBNCMDataAux. With no
  # function driver for the two NCM interfaces, IOUSBDeviceController gives up 10 s later ("Giving up with 2 function(s)
  # unregistered") and never goes on the bus (phone run 2026-11-16 05:41 UTC). Adds com.apple.driver.usb.networking and
  # com.apple.iokit.IONetworkingFamily as its libraries.
  "com.apple.driver.AppleUSBDeviceNCM",
  # OPOIOS: com.apple.iokit.IONetworkingFamily is a root for its IONetworkStack personality. As a mere library of the NCM
  # driver its personalities were dropped, so IONetworkStack never existed. AppleUSBDeviceNCM11Data::start names its interface
  # through usb.networking nameBSDInterface, which calls waitForService(IONetworkStack) with no timeout, so start never
  # returned, the AppleUSBNCMDataAux nub stayed busy, and restored_external sat in enable_usb (IOServiceWaitQuiet) with
  # nobody accepting on port 62078 (phone runs 2026-11-16 21:50 and 22:06 UTC, BUSY report).
  "com.apple.iokit.IONetworkingFamily",
  "com.apple.iokit.IOUSBHostFamily", "com.apple.driver.usb.AppleUSBXHCI", "com.apple.driver.usb.AppleUSBHub",
  "com.apple.driver.usb.AppleUSBHostCompositeDevice", "com.apple.driver.usb.IOUSBHostHIDDevice", "com.apple.iokit.IOUSBMassStorageDriver",
  "com.apple.iokit.IOSCSIArchitectureModelFamily", "com.apple.iokit.IOSCSIBlockCommandsDevice",
  "!com.apple.driver.AppleOnboardSerial", "!com.apple.driver.AppleSMC",
]

[firmware]
# OPOIOS uefi xueyingPkg (uefi-sheng fork, branch xueying): no vendor DXEs, no UFS/SDCC/USB-MSD/UFP, framebuffer on the
# inner panel 2440 x 2268 (ABL scans 0xB8000000 out there after fastboot boot). Verified on the phone 2026-11-15.
config = "xueying"
dsc = "Platforms/OnePlus/xueyingPkg/xueying.dsc"
fd = "Build/xueyingPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[payload]
volume = "XUEYINGESP"
# OPOIOS: the prelinked kernel (about 90 MiB), the packed Data seed (1.3 MiB) and the owner trust bundle (94 KiB). Kept at the
# stage 3 size (the packed restore ramdisk was 184 MiB) so the boot image, and the payload pages ABL leaves at 0xBA013E000 that
# the RAM root store goes around, stay as measured (store2, 2026-11-18).
size_mib = 300
loader = "firmware"
title = "OPOIOS iOS 27"
dram_size = "0x80000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
# OPOIOS stage 4: console, the CPU display path on the firmware framebuffer, keys, SMP; the root is the OS volume of the RAM
# root store ([payload.adt] root_match_volume_uuid, no rd=). Removed from aston: native-source-storage, native-ufs-root (UFS
# root), sheng-log (log writer on userdata), sheng-data-persist (Data store on userdata), touch (Synaptics on aston; Goodix
# GT9966/GT9916 here), GPU, battery, ADSP, backlight (AA551 panel on aston), Wi-Fi, cpufreq.
kernel_args = [
  "-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0",
  # OPOIOS: opoios-ram-root=2 starts the loader's RAM disk (NativeRamBlock, here the Data seed) without UFS, then the RAM root
  # store UEFI received over USB: its OS and SystemOS windows as verified read-only disks (package/OpoiosRootStoreDisk.cpp).
  # package/SourceStorage.cpp registers only the source IOBlockStorageDevice, NativeRamBlock and OpoiosRootStoreDisk; NativeUfs
  # is never registered. Without a store the STORE row of the report says why (st -2: no descriptor) and the root wait panics.
  # opoios-sys-report=300: 300 s after the RAM disk starts the kernel panics with one row: root, RAM disk and store traffic,
  # processes by pid (package/SourceStorage.cpp), and prints that row every 15 s before. The panic ends the run; the phone
  # stays on the panic screen until the owner unplugs USB and holds Vol+ and Power. Stage 3's 60 s was about launchd's start.
  "opoios-ram-root=2", "opoios-sys-report=300",
  "offline-mobile-graphics-load=1", "offline-mobile-graphics-client=1", "offline-legacy-register=1", "offline-legacy-gop=1",
  "offline-legacy-unit-scale=3", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "offline-key-events=1", "sheng-buttons=1",
  # OPOIOS stage 4: sheng-aks=1 as on aston. offline-key-events starts the owned AppleKeyStore service on ephemeral Data
  # (package/KeyStoreProbe.cpp); with sheng-aks it also answers the state queries of the full iOS (no passcode, nothing
  # locked). It holds no keys and touches no storage; there is no SEP.
  "sheng-aks=1",
  # OPOIOS: eight CPUs (smp=1). The "SMP hang" of 2026-11-15 was Image4's magazine panic (no boot-manifest-hash) stuck halfway
  # on SMP: its first screen lines were drawn and the other CPUs ran on. With boot-manifest-hash the 8-CPU boot reaches
  # restored_external like the one-CPU boot (device 2026-11-15 23:23).
  "smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1",
  "no-lc=1", "vsync=60", "vsync-fixed=1", "sheng-disable-watchdogd=1", "sheng-lite=1",
  # OPOIOS: USB device mode (drivers/QcomDwc3 behind Apple's AppleUSBXDCI), USB 2.0 only (no sheng-usb-ss: this phone has no
  # PS5169 retimer). Checked against this phone's own device tree: controller 0xa600000, eUSB2 PHY 0x88e3000, repeater on pm8550b
  # SID 7 at 0xfd00 (tuning from its param-override-seq), rails L1E 880 mV, L3E 1200 mV, L15B 1800 mV, L5B 3104 mV, L3F 912 mV.
  # Without the charger or UCSI (no ADSP here) the driver takes the device role.
  "sheng-usb=1",
]

[payload.adt]
chip_id = "8142"
owned_memory_size = "0x130000000"
# OPOIOS stage 4: the packed RAM disk is the Data seed of CI run 44390999272 (.github/workflows/opoios-data-seed.yml; volume
# DA604258-7750-46D4-BD55-A4B3D6A429D7 = CONFIG_XNU_OWNER_DATA_VOLUME_UUID), with the owner trust bundle of that run
# (StaticTrustCache, Cryptex1,SystemTrustCache and Cryptex1,AppTrustCache of the IPSW, unchanged). No persistent_data:
# the ADT says ephemeral-storage and RamBlock keeps every write in RAM.
packed_data_ramdisk = true
# The root: the OS volume of the 24A446 OS image (the profile's [root] os_volume_uuid and its own root_match_volume_uuid),
# served by the RAM root store's OS window. Stage 3 matched the restore ramdisk's volume A21BAD53-1478-4E76-8EB4-19970D00EE06.
root_match_volume_uuid = "E3F4AED0-4454-4D5B-833C-E27E99C4F67B"
unique_chip_id = "required"

[bootimg]
# The phone's own live device tree (OPOIOS inventory 2026-11-14), /chosen removed: no serial numbers.
dtb = "../uefi-sheng/Resources/DTBs/xueying.dtb"
dtb_node = [{ path = "/reserved-memory/splash_region", props = [{ name = "label", type = "s", value = "cont_splash_region" }, { name = "reg", type = "x", value = ["0x0", "0xb8000000", "0x0", "0x2b00000"] }] }]

[device_tree]
source = "device:dts/xueying.dts"
include_dirs = ["soc:dts"]

[components]
# OPOIOS: SoftwareAES only puts drivers/SoftwareAES into the build tree; build-gop-legacy-display-27.py compiles NativeAES against
# software-aes-24A446-d94ap.json (no component:SoftwareAES archive step: that build targets the iPadOS 17 class layout).
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "ShengPreflight", "ShengUfs", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "Adreno740", "AdrenoMetal", "SoftwareAES"]

[adt.product.string]
# The iPad model override of the iPadOS chain (J120AP) is left out: the profile's iPhone17,2 identity stands.
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.root.string]
# OPOIOS: XNU publishes IOPlatformSerialNumber only from the ADT root's serial-number, which iBoot fills on an iPhone.
# restored_external's QueryType reply puts that property in a dictionary and aborted on NULL (phone run 2026-11-17 18:47 UTC:
# -[__NSDictionaryM __setObject:forKey:] in handle_type_query); with this value it answers (run 18:57 UTC). The profile's root
# strings (model, target-type, target-sub-type, compatible) merge with it. A fixed placeholder, never this phone's serial number.
serial-number = "OPOIOS000001"

[adt.defaults.u32]
sleep-disabled = 1
# No Apple PMGR or SEP: report a virtual platform, so AMFI does not wait for an ApplePMGRNub (as the reference board).
vmm-present = 1
# memory/64K + 1024 for the owned 4864 MiB (the reference value).
"kern.maxvnodes" = 78848

[adt.chosen.u32]
# SM8550 has no CTRR.
kernel-ctrr-to-be-enabled = 0

# OPOIOS stage 4: no [adt.chosen.bytes] boot-manifest-hash. Stage 3 set the owner's fixed value (SHA-384 of the label "OPOIOS
# owner boot manifest v1 (no Apple ticket)") for Image4::start's magazine. Now the kernel publishes /chosen/boot-manifest-hash
# itself before launchd (CONFIG_XNU_OWNER_BOOT_MANIFEST, patches offline-owner-boot-manifest and offline-owner-systemos-mount):
# SHA-384 over the domain "VerifiedRoot.OwnerBootSet.v1" and the SHA-384 of the OS and SystemOS signed policy headers, which
# the RAM root store verified. It refuses to replace a value already in /chosen, so the ADT must carry none.

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-27.0.1-24A446" = "aston_ipados27_defconfig"
"ios-27.0.1-24A446" = "aston_ios27_defconfig"
