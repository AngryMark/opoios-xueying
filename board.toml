schema_version = 2
# OnePlus Open CPH2551 (xueying, OnePlus projects 22003/22899), SM8550-AB, 16 GiB / 512 GiB, OxygenOS 16.0.1.300(EX01).
# OPOIOS fork of MoyuZJ912/UniXNU-aston b8832d72 (OnePlus Ace 3, iOS 27.0.1 24A446 as iPhone17,2 D94AP), itself derived from
# UniXNU-sheng. This is the owner's ONLY daily phone: every boot is `fastboot boot` from RAM, nothing is ever flashed, and no
# storage write path may be enabled (no [userdata], no native-ufs-root, no data-persist, no log, no persistent_data; the
# device tree never enables &ufs). Check with OPOIOS scripts/check-safe-config.sh before every boot.
# Stage 3: XNU to launchd with the IPSW's restore ramdisk as root (RamBlock, rd=md0-ramblock), no GPU/touch/Wi-Fi/DSP yet.
# The package keeps the reference kit name "sheng" (installed as kits/sheng) and the "sheng-*" boot argument names: the shared
# scripts and drivers address the board kit by that name.
[board]
name = "xueying"
soc = "SM8550"
description = "OnePlus Open CPH2551 (xueying) - OPOIOS, RAM only"
kit = "sheng"
soc_source = "sm8550"
os_profile = "ios-27.0.1-24A446"

[kernel]
defconfig = "aston_ios27_defconfig"
config_fragments = ["arch:configs/common.config", "os:configs/ios.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu-12377/series"]
# The reference 24A446 archive chain. build-gop-legacy-display-27.py builds the board objects (touch, keys, brightness, battery,
# CPU frequency, GPU power) and links them against the original families of this fileset. fetch-sheng-dts.py and the prepare-sheng-*
# generators still read the reference board's devicetree for the GPU inputs (the same kalama GPU and GMU nodes).
archives = [
  # OPOIOS: aston's prepare-aston-ramblock.py is left out. It stages aston's "publish after store" fix of the persistent
  # Data store over RamBlock 60a54ce8 and refuses any other revision; UniXNU main carries RamBlock 737f6da (60a54ce8 plus
  # "report the device as solid state" and "return the packed seed's memory after the import"). Without a store
  # (no data-persist, no UFS in the device tree) the fix and the original publish the RAM disk the same way.
  # Before any storage step: component:ShengUfs runs build-sheng-source-storage.py without --policy-dir.
  "stage-aston-root-policies.py scripts/policies/ios-27.0.1-24A446",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "component:ShengUfs",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ios-27.0.1-24A446",
  "component:RamBlock",
  "component:Adreno740",
  "fetch-sheng-dts.py",
  "fetch-adreno-inputs.py",
  "prepare-sheng-gmu.py",
  "prepare-sheng-gpu-smmu.py",
  "prepare-sheng-gmu-votes.py",
  "build-adreno740-kits.py",
  # The IOAcceleratorES ABI of this kernelcache, before the accelerator builder seeds the iPad record.
  "stage-aston-accelerator-abi.py",
  "build-adreno740-accelerator.py",
  "component:AppleKeyStoreState",
  # OPOIOS: UniXNU requires an archive entry for every selected kernel-stage component. This one only compiles NativeAES for
  # the iPadOS 17 layout into build/software-aes (not linked: XNU_NATIVE_AES is off); the linked NativeAES is the one
  # build-gop-legacy-display-27.py compiles against software-aes-24A446-d94ap.json (as UniXNU-sheng for macOS 27.3).
  "component:SoftwareAES",
  "build-gop-legacy-display-27.py",
  "build-fileset-release-reference.py --tree . --lto",
]

[kernel.prelink]
# The profile's roots plus the USB device and host stacks (the reference board's list; the SoC's USB controller is the same).
# The iPhone17,2 fileset has no com.apple.iokit.IOHIDEventDriver bundle (the class ships in IOHIDFamily).
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOUSBDeviceFamily", "com.apple.driver.AppleUSBXDCI", "com.apple.driver.AppleUSBDeviceMux",
  "com.apple.iokit.IOUSBHostFamily", "com.apple.driver.usb.AppleUSBXHCI", "com.apple.driver.usb.AppleUSBHub",
  "com.apple.driver.usb.AppleUSBHostCompositeDevice", "com.apple.driver.usb.IOUSBHostHIDDevice", "com.apple.iokit.IOUSBMassStorageDriver",
  "com.apple.iokit.IOSCSIArchitectureModelFamily", "com.apple.iokit.IOSCSIBlockCommandsDevice",
  "!com.apple.driver.AppleOnboardSerial", "!com.apple.driver.AppleSMC",
]

[firmware]
# OPOIOS uefi xueyingPkg (uefi-sheng fork, branch xueying): no vendor DXEs, no UFS/SDCC/USB-MSD/UFP, framebuffer on the
# inner panel 2440 x 2268 (ABL scans 0xB8000000 out there after fastboot boot). Verified on the phone 2026-11-15.
config = "xueying"
dsc = "Platforms/OnePlus/xueyingPkg/xueying.dsc"
fd = "Build/xueyingPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[payload]
volume = "XUEYINGESP"
# OPOIOS stage 3: the prelinked kernel (about 90 MiB) and the packed restore ramdisk (DBRDISK1, 184 MiB) as the RAM root
# take about 274 MiB; the payload step wants 5 % room.
size_mib = 300
loader = "firmware"
title = "OPOIOS iOS 27"
dram_size = "0x80000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
# OPOIOS stage 3: console, the CPU display path on the firmware framebuffer, keys, SMP; the root on the payload's RAM disk
# (rd=md0-ramblock: the RamBlock disk is the root and bsd_init skips the sealed-root check, OddlyLabs/unixnu-fuxi r3-ramblock).
# Removed from aston: native-source-storage, native-ufs-root (UFS root), sheng-log (log writer on userdata), sheng-data-persist
# (Data store on userdata), sheng-aks, touch (Synaptics on aston; Goodix GT9966/GT9916 here), GPU, battery, ADSP, backlight
# (AA551 panel on aston), Wi-Fi, cpufreq.
kernel_args = [
  "-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0",
  # OPOIOS: opoios-ram-root=1 starts the loader's RAM disk (NativeRamBlock) without UFS: package/SourceStorage.cpp registers
  # only the source IOBlockStorageDevice and NativeRamBlock. Without it nothing starts the disk and the root wait panics
  # (device 2026-11-15: "Failed to mount root device" after waiting for the volume UUID).
  # opoios-sys-report=60: 60 s after the RAM root starts the kernel panics with one row: root, RAM disk traffic, processes by pid
  # (package/SourceStorage.cpp), and prints that row every 15 s before. The panic ends the run; the phone then powers off.
  "rd=md0-ramblock", "opoios-ram-root=1", "opoios-sys-report=60",
  "offline-mobile-graphics-load=1", "offline-mobile-graphics-client=1", "offline-legacy-register=1", "offline-legacy-gop=1",
  "offline-legacy-unit-scale=3", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "offline-key-events=1", "sheng-buttons=1",
  "smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1",
  "no-lc=1", "vsync=60", "vsync-fixed=1", "sheng-disable-watchdogd=1", "sheng-lite=1",
]

[payload.adt]
chip_id = "8142"
owned_memory_size = "0x130000000"
packed_data_ramdisk = true
# OPOIOS root: the restore ramdisk 043-69915-784.dmg (RestoreRamDisk of 24A446) as the packed RAM disk, with the restore
# trust cache (043-69915-784.dmg.trustcache). Its single APFS volume "ramdisk" (raw APFS inside IM4P rdsk, 232.0 MiB,
# 184.0 MiB nonzero), read with OPOIOS tools/restore_ramdisk_info.py:
root_match_volume_uuid = "A21BAD53-1478-4E76-8EB4-19970D00EE06"
unique_chip_id = "required"

[bootimg]
# The phone's own live device tree (OPOIOS inventory 2026-11-14), /chosen removed: no serial numbers.
dtb = "../uefi-sheng/Resources/DTBs/xueying.dtb"
dtb_node = [{ path = "/reserved-memory/splash_region", props = [{ name = "label", type = "s", value = "cont_splash_region" }, { name = "reg", type = "x", value = ["0x0", "0xb8000000", "0x0", "0x2b00000"] }] }]

[device_tree]
source = "device:dts/xueying.dts"
include_dirs = ["soc:dts"]

[components]
# OPOIOS: SoftwareAES only puts drivers/SoftwareAES into the build tree; build-gop-legacy-display-27.py compiles NativeAES against
# software-aes-24A446-d94ap.json (no component:SoftwareAES archive step: that build targets the iPadOS 17 class layout).
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "ShengPreflight", "ShengUfs", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "Adreno740", "AdrenoMetal", "SoftwareAES"]

[adt.product.string]
# The iPad model override of the iPadOS chain (J120AP) is left out: the profile's iPhone17,2 identity stands.
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1
# No Apple PMGR or SEP: report a virtual platform, so AMFI does not wait for an ApplePMGRNub (as the reference board).
vmm-present = 1
# memory/64K + 1024 for the owned 4864 MiB (the reference value).
"kern.maxvnodes" = 78848

[adt.chosen.u32]
# SM8550 has no CTRR.
kernel-ctrr-to-be-enabled = 0

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-27.0.1-24A446" = "aston_ipados27_defconfig"
"ios-27.0.1-24A446" = "aston_ios27_defconfig"
